<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>[hidden]{display:none!important}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}</style>
</head>
<body>
<title>Sourcery Process Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: a single whiteboard (white, dot grid) with three views routed on the hash: overview, step walk-through, full board. Deliberately light-only, like a real whiteboard. */
:root{
  --board:#FFFFFF; --dots:#E4E1EC; --ink:#24212E; --line:#3A3550; --muted:#5F5A73; --hand:#5A5470;
  --acc:#6E5BB5; --acc2:#4D3F8C; --sv:#B1A7D3; --you:#EEEEEE; --tint:#EEEAF8; --row:#F4F3F8; --rule:#E6E3EF;
  --chrome:#F7F6FB; --dot:#D6D2E4; --ok:#2F7D4F; --warn:#9A3412; --warnbg:#FFF6EE; --warnline:#F0C9A8; --risk:#C2410C;
  --cad:#2F5E9E; --cadthin:#8AA6CC; --cadbg:#F7F9FC; --paper:#FFFFFF; --soft:#8C84AE;
  --f-hand:"Caveat","Comic Sans MS",cursive; --f-ui:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
html,body{background:var(--board)}
body{color:var(--ink);font-family:var(--f-ui);background-image:radial-gradient(var(--dots) 1.2px,transparent 1.2px);background-size:28px 28px;min-height:100vh}
a{color:var(--acc2)}
button{font-family:inherit}
:focus-visible{outline:3px solid var(--acc);outline-offset:3px}

/* ---------- top bar ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(255,255,255,.92);backdrop-filter:blur(4px);border-bottom:1.5px dashed var(--dot);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--board)}
.brand{font-weight:700;font-size:18px;letter-spacing:-.01em;color:var(--ink);text-decoration:none}
.brand span{font-family:var(--f-hand);font-weight:500;font-size:20px;color:var(--acc);margin-left:6px}
.nav{display:flex;gap:6px;flex-wrap:wrap}
.nav a{font-size:14px;font-weight:500;color:var(--muted);text-decoration:none;padding:7px 12px;border-radius:9px;border:1.5px solid transparent}
.nav a[aria-current="page"]{color:var(--ink);border-color:var(--line);background:var(--paper)}
.nav a:hover{color:var(--ink)}

.view{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 40px}

/* ---------- home ---------- */
.view.home{padding-left:max(clamp(24px,8vw,140px),env(safe-area-inset-left,0px));padding-right:max(clamp(24px,8vw,140px),env(safe-area-inset-right,0px));padding-block:48px 64px;min-height:calc(100vh - 62px);box-sizing:border-box;display:flex;flex-direction:column}
.home-title{max-width:1100px;margin:0 auto 32px;text-align:center;font-size:clamp(26px,3.4vw,36px);letter-spacing:-.02em;text-wrap:balance}
.grid-wrap{position:relative;width:100%;max-width:1100px;margin:auto}
.grid8{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:110px 56px;list-style:none;padding:0;margin:0}
.grid8 li{position:relative;min-width:0}
.grid8 li:not(:nth-child(4n))::after{content:"";position:absolute;top:50%;right:-50px;width:44px;height:2px;border-top:3px dashed var(--line)}
.grid8 li:not(:nth-child(4n))::before{content:"";position:absolute;top:calc(50% - 6px);right:-52px;border:7px solid transparent;border-left:10px solid var(--line);border-right:0}
.card{position:relative;display:flex;align-items:center;justify-content:center;text-align:center;min-height:128px;height:100%;box-sizing:border-box;padding:30px 26px 22px;border:2px solid var(--line);border-radius:16px;background:var(--paper);
  box-shadow:5px 5px 0 rgba(58,53,80,.12);text-decoration:none;color:var(--ink);font-size:19px;line-height:1.3;text-wrap:balance;transition:transform .15s,box-shadow .15s}
.card:hover{transform:translate(-2px,-2px);box-shadow:7px 7px 0 rgba(58,53,80,.16)}
.num{position:absolute;top:10px;left:10px;width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;background:var(--paper)}
.wrap45{position:absolute;left:0;top:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.wrap45 #p45{fill:none;stroke:var(--line);stroke-width:3;stroke-dasharray:10 6;stroke-linecap:round}
.wrap45 #h45{fill:var(--line)}
@media (max-width:1000px){.grid8{grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}.grid8 li::after,.grid8 li::before{display:none}.wrap45{display:none}}
@media (max-width:560px){.grid8{grid-template-columns:minmax(0,1fr)}}

/* ---------- step page ---------- */
.dock{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:25;display:flex;flex-direction:column;align-items:center;gap:8px;max-width:calc(100vw - 32px)}
.strip{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;align-items:center;background:rgba(255,255,255,.9);border-radius:12px;padding:3px 6px}
.strip::before{content:"jump to step";font-size:11px;color:var(--muted);margin-right:4px}
.strip a{width:24px;height:24px;border-radius:50%;border:1px solid var(--dot);display:flex;align-items:center;justify-content:center;font-weight:500;font-size:11px;text-decoration:none;color:var(--muted);background:var(--paper)}
.strip a:hover{border-color:var(--soft);color:var(--ink)}
.strip a[aria-current="step"]{border-color:var(--soft);background:var(--tint);color:var(--acc2);font-weight:600}
.canvas-wrap{overflow-x:auto;padding-bottom:170px}
.canvas-wrap .step-root{margin:0 auto}
.controls{display:flex;gap:8px;align-items:center;
  background:var(--paper);border:2px solid var(--line);border-radius:16px;padding:8px;box-shadow:5px 5px 0 rgba(58,53,80,.14);max-width:calc(100vw - 32px);box-sizing:border-box}
.controls button{height:44px;padding:0 16px;border-radius:10px;border:1.5px solid var(--sv);background:var(--paper);color:var(--acc2);font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap}
.controls button.play{background:var(--acc);border-color:var(--acc);color:#fff;min-width:110px}
.controls button:disabled{opacity:.4;cursor:default}
.controls .where{font-family:var(--f-hand);font-size:20px;color:var(--hand);padding:0 6px;white-space:nowrap}
.keys{text-align:center;font-size:12px;color:var(--muted);margin-top:-8px;margin-bottom:12px}
.keys kbd{font-family:inherit;border:1px solid var(--dot);border-bottom-width:2px;border-radius:4px;padding:0 5px;background:var(--paper)}

/* ---------- board page ---------- */
.board-bar{display:flex;flex-wrap:wrap;gap:10px 24px;align-items:flex-end;margin-bottom:14px}
.board-bar h1{margin:0;font-size:26px;letter-spacing:-.02em}
.board-bar h1 span{color:var(--acc);font-weight:500}
.legend{display:flex;gap:16px;align-items:center;font-size:14px;color:var(--line);flex-wrap:wrap}
.legend i{display:inline-block;width:26px;height:16px;border-radius:5px;border:2px solid #555;vertical-align:-3px;margin-right:6px}
.zoom{margin-left:auto;display:flex;gap:6px}
.zoom button{height:36px;padding:0 12px;border-radius:9px;border:1.5px solid var(--sv);background:var(--paper);color:var(--acc2);font-weight:600;cursor:pointer}
.zoom button[aria-pressed="true"]{background:var(--acc);color:#fff;border-color:var(--acc)}
.board-scroll{overflow:auto;border:1.5px dashed var(--dot);border-radius:12px;background:transparent}
.board{position:relative;width:6940px;height:1000px;transform-origin:0 0}
.board .step-root{position:absolute;top:0}

/* ---------- step building blocks ---------- */
.step-root{position:relative;width:760px;font-family:var(--f-ui);color:var(--ink)}
.step-root *{box-sizing:border-box}
.a{position:absolute}
.stage{position:absolute;inset:0;pointer-events:none;opacity:0;visibility:hidden;transition:opacity .35s}
.stage.shown{opacity:1;visibility:visible;pointer-events:auto}
.pill{position:absolute;left:120px;top:10px;width:520px;height:60px;border:2px solid #555;border-radius:14px;background:var(--sv);display:flex;align-items:center;justify-content:center;gap:12px;font-size:18px;white-space:nowrap;padding:0 10px}
.pill.you{background:var(--you)}
.pill b{flex:none;width:28px;height:28px;border-radius:50%;background:#fff;border:2px solid #555;font-size:14px;display:flex;align-items:center;justify-content:center}
.win{position:absolute;left:120px;width:520px;border:2px solid var(--line);border-radius:14px;background:var(--paper);box-shadow:5px 5px 0 rgba(58,53,80,.12);overflow:hidden;display:flex;flex-direction:column}
.chrome{height:30px;flex:none;display:flex;align-items:center;gap:7px;padding:0 12px;border-bottom:1px solid var(--rule);background:var(--chrome);font-size:12px;color:var(--muted)}
.chrome i{width:8px;height:8px;border-radius:50%;background:var(--dot)}
.chrome span{margin-left:4px}
.wb{flex:1;padding:12px 16px;display:flex;flex-direction:column;gap:10px;min-height:0}
.grp{display:flex;flex-direction:column;gap:5px}
.sec{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;color:var(--muted);gap:8px}
.sec .k{font-weight:700;letter-spacing:.06em;color:var(--acc)}
.okt{font-weight:700;color:var(--ok);font-size:13px}
.row{display:flex;gap:8px;align-items:center;font-size:13px;padding:6px 10px;border-radius:7px;background:var(--row)}
.row .f{flex:1;min-width:0}
.th{display:flex;gap:8px;font-size:11px;font-weight:700;letter-spacing:.05em;color:var(--acc);padding:0 10px}
.chips{display:flex;flex-wrap:wrap;gap:6px;font-size:12px}
.chip{padding:4px 9px;border-radius:12px;background:var(--row);border:1px solid var(--rule)}
.a.chip{font-size:12px;white-space:nowrap}
.chip.pick{background:var(--tint);border-color:var(--sv)}
.searchbox{position:relative;overflow:hidden;height:30px;border:1px solid var(--dot);border-radius:8px;display:flex;align-items:center;padding:0 10px;font-size:13px;color:var(--line)}
.scan{position:absolute;top:0;bottom:0;left:-35%;width:35%;background:linear-gradient(90deg,rgba(110,91,181,0),rgba(110,91,181,.25),rgba(110,91,181,0))}
.stat{flex:1;border-radius:9px;background:var(--tint);border:1px solid var(--sv);padding:6px 12px;display:flex;flex-direction:column;gap:2px}
.stat .k{font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--acc2)}
.meter{display:flex;gap:3px}.meter i{width:22px;height:8px;border-radius:2px;background:var(--rule)}
.alert{border:1px solid var(--warnline);background:var(--warnbg);border-radius:9px;padding:8px 10px;font-size:12px;line-height:1.4}
.alert b{display:block;font-size:13px}
.btns{display:flex;gap:8px}
.btn{flex:1;height:36px;border-radius:8px;font-size:12px;font-weight:600;border:1px solid var(--sv);background:var(--paper);color:var(--acc2);display:flex;align-items:center;justify-content:center}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.opt{position:relative;padding:4px 9px;border-radius:7px;border:1px solid var(--dot);white-space:nowrap}
.opt .fill{position:absolute;inset:-1px;border-radius:7px;background:var(--acc);color:#fff;font-weight:600;padding:4px 9px;white-space:nowrap}
.opt.risky{border-color:var(--warnline);background:var(--warnbg);color:var(--warn)}
.bubble{position:absolute;font-size:12px;line-height:1.4;padding:9px 11px}
.hand{position:absolute;font-family:var(--f-hand);color:var(--hand);line-height:1.05}
.sublab{position:absolute;font-family:var(--f-hand);font-size:24px;line-height:1;color:var(--acc2)}
.sublab b{font-weight:700}
.cap{position:absolute;left:0;width:760px;text-align:center;font-family:var(--f-hand);font-size:25px;color:var(--acc2);padding:0 20px}
.ic{position:absolute;fill:none;stroke:var(--line);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;overflow:visible}
.ic.p{stroke:var(--acc)}
.ic.w{fill:#fff}
.cad{fill:none;stroke:var(--cad);stroke-width:2;stroke-linejoin:round}
.cadthin{fill:none;stroke:var(--cadthin);stroke-width:1}
.route{fill:none;stroke:var(--soft);stroke-width:3;stroke-dasharray:7 7;stroke-linecap:round}
.tag{font-size:12px;font-weight:700;padding:2px 8px;border-radius:10px;background:var(--acc);color:#fff;white-space:nowrap}
.tag.g{background:var(--ok)}
.flag{display:flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:3px 8px;border-radius:8px;background:var(--warnbg);border:1.5px solid var(--risk);color:var(--warn);white-space:nowrap}
.ask{font-family:var(--f-hand);font-size:19px;color:var(--acc);background:#fff;border:1.5px solid var(--acc);border-radius:10px;padding:0 8px;white-space:nowrap}
.press{position:relative;width:168px;height:40px;border:none;border-radius:9px;color:#fff;font-size:13px;font-weight:600;background:var(--acc)}
.press span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}

/* ---------- play-once animation model ----------
   idle (revealed, not played) -> .playing (runs once) -> .done (final state holds) */
.tok{opacity:0}
.ap{opacity:0}
.lbl{opacity:0}
.bar{width:0}
.draw{stroke-dasharray:700;stroke-dashoffset:700}
.truck{offset-path:path('M185 495 C 280 470, 460 520, 565 492');offset-rotate:0deg;offset-distance:0%}
.cursor{opacity:0}
.bt2{opacity:0}

.done .ap,.done .tok.stay{opacity:1}
.done .bar{width:var(--w)}
.done .draw{stroke-dashoffset:0}
.done .truck{offset-distance:100%}
.done .press{background:var(--ok)}
.done .bt1{opacity:0}.done .bt2{opacity:1}

.playing .tok{animation:fly var(--d,1.4s) ease-in-out var(--t,0s) both}
.playing .tok.stay{animation-name:flyStay}
.playing .ap{animation:appear .5s ease-out var(--t,0s) both}
.playing .lbl{animation:blip var(--d,2s) ease var(--t,0s) both}
.playing .bar{animation:grow 1.6s ease-out var(--t,0s) both}
.playing .draw{animation:draw 2.4s ease-in-out var(--t,0s) both}
.playing .scan{animation:scan 1.3s linear var(--t,0s) 2 both}
.playing .truck{animation:drive 3s ease-in-out var(--t,0s) both}
.playing .cursor{animation:cur 1.4s ease-in-out var(--t,0s) both}
.playing .press{animation:press 1.4s ease-in-out var(--t,0s) both}
.playing .bt1{animation:hide .2s linear calc(var(--t,0s) + 1.15s) both}
.playing .bt2{animation:appear .2s linear calc(var(--t,0s) + 1.15s) both}

@keyframes fly{0%{opacity:0;transform:translate(var(--fx),var(--fy))}12%{opacity:1;transform:translate(var(--fx),var(--fy))}78%{opacity:1;transform:none}100%{opacity:0;transform:none}}
@keyframes flyStay{0%{opacity:0;transform:translate(var(--fx),var(--fy))}12%{opacity:1;transform:translate(var(--fx),var(--fy))}100%{opacity:1;transform:none}}
@keyframes appear{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes hide{from{opacity:1}to{opacity:0}}
@keyframes blip{0%{opacity:0}15%{opacity:1}80%{opacity:1}100%{opacity:0}}
@keyframes grow{from{width:0}to{width:var(--w)}}
@keyframes draw{from{stroke-dashoffset:700}to{stroke-dashoffset:0}}
@keyframes scan{from{left:-35%}to{left:105%}}
@keyframes drive{from{offset-distance:0%}to{offset-distance:100%}}
@keyframes cur{0%{opacity:0;transform:translate(70px,46px)}15%{opacity:1;transform:translate(70px,46px)}68%{opacity:1;transform:none}76%{opacity:1;transform:scale(.82)}86%{opacity:1;transform:none}100%{opacity:0;transform:none}}
@keyframes press{0%,74%{background:var(--acc)}80%{background:var(--acc2)}100%{background:var(--ok)}}
@media (prefers-reduced-motion:reduce){.playing *{animation-duration:.01s!important;animation-delay:0s!important;animation-iteration-count:1!important}.stage{transition:none}}
</style>

<header class="top">
  <nav class="nav" aria-label="Views">
    <a href="#home" data-nav="home">Process overview</a>
    <a href="#step-1" data-nav="step">Walk through steps</a>
    <a href="#board" data-nav="board">Full whiteboard</a>
  </nav>
</header>

<main>
  <section id="v-home" class="view home" hidden>
    <h1 class="home-title">CAD-to-Production Process at a very high level</h1>
    <div class="grid-wrap">
      <ol class="grid8" id="grid8"></ol>
      <svg class="wrap45" id="wrap45" aria-hidden="true"><path id="p45" d=""/><path id="h45" d=""/></svg>
    </div>
  </section>

  <section id="v-step" class="view" hidden>
    <div class="canvas-wrap" id="stepCanvas"></div>
    <div class="dock">
      <div class="controls" role="toolbar" aria-label="Step controls">
        <button type="button" id="bBack">← Back</button>
        <button type="button" class="play" id="bPlay">▶ Play</button>
        <button type="button" id="bNext">Next →</button>
        <span class="where" id="where"></span>
      </div>
      <nav class="strip" id="strip" aria-label="Jump to step"></nav>
    </div>
  </section>

  <section id="v-board" class="view" hidden>
    <div class="board-bar">
      <h1>Sourcery <span>· design to delivery, end to end</span></h1>
      <div class="legend"><span><i style="background:var(--you)"></i>You do this</span><span><i style="background:var(--sv)"></i>Sourcery handles it</span></div>
      <div class="zoom" role="group" aria-label="Zoom">
        <button type="button" data-z="0.5">50%</button>
        <button type="button" data-z="0.75" aria-pressed="true">75%</button>
        <button type="button" data-z="1">100%</button>
      </div>
    </div>
    <div class="board-scroll"><div id="boardSize"><div class="board" id="board"></div></div></div>
  </section>
</main>

<!-- ======================= STEP TEMPLATES ======================= -->

<template id="t1">
<div class="step-root" style="height:620px">
  <div class="pill you"><b>1</b>You create CAD &amp; Drawings</div>
  <div class="stage" data-s="0">
    <svg class="ic" style="left:22px;top:180px" width="64" height="72"><use href="#i-person"/></svg>
    <div class="hand" style="left:36px;top:252px;font-size:22px">you</div>
    <svg class="ic" style="left:80px;top:196px" width="40" height="24" viewBox="0 0 40 24"><path d="M2 14 C 12 6, 24 6, 34 12 M27 6 L35 12 L27 17"/></svg>
    <div class="win" style="top:90px;height:340px">

<script>
(function(){
  var STEPS=[
    {n:1,title:"You create CAD & Drawings",desc:"The engineer finalizes the CAD model, drawings and BOM for the build."},
    {n:2,title:"Upload documentation package to portal",desc:"Package the STEP files, drawings and BOM and get them to suppliers or a sourcing portal."},
    {n:3,title:"Find suppliers for custom & off-the-shelf parts",desc:"Search for shops and distributors, send RFQs and collect quotes."},
    {n:4,title:"Communicate DFM feedback (if any)",desc:"Suppliers push back on features that are hard or costly to make; the engineer revises."},
    {n:5,title:"Place orders with suppliers",desc:"Compare quotes, choose a supplier for each part and issue POs."},
    {n:6,title:"Closely monitor order progress & provide updates",desc:"Chase suppliers for status and keep the team updated when things slip."},
    {n:7,title:"Track shipments to delivery",desc:"Follow tracking numbers and catch delays before the build date."},
    {n:8,title:"Parts arrive at your facility",desc:"Receive the parts, check them against the BOM and start the build."}
  ];

  function el(id){return document.getElementById(id)}
  function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;")}
  function cloneStep(n){return el("t"+n).content.firstElementChild.cloneNode(true)}

  /* home */
  el("grid8").innerHTML=STEPS.map(function(s){
    return '<li><a class="card" href="#step-'+s.n+'"><span class="num">'+s.n+'</span>'+esc(s.title).replace(/-/g,"‑")+'</a></li>';
  }).join("");
  function draw45(){
    var g=el("grid8"), li=g.children; if(el("v-home").hidden||li.length<5)return;
    var w=g.getBoundingClientRect(), a=li[3].getBoundingClientRect(), b=li[4].getBoundingClientRect();
    if(Math.abs(a.top-b.top)<5){el("p45").setAttribute("d","");el("h45").setAttribute("d","");return}
    var x1=a.right-w.left, y1=a.top-w.top+a.height/2, xr=x1+28, ym=(a.bottom+b.top)/2-w.top, xl=b.left-w.left-28, y2=b.top-w.top+b.height/2, x2=b.left-w.left-8;
    el("p45").setAttribute("d","M"+x1+" "+y1+" L"+xr+" "+y1+" L"+xr+" "+ym+" L"+xl+" "+ym+" L"+xl+" "+y2+" L"+(x2-6)+" "+y2);
    el("h45").setAttribute("d","M"+(x2+2)+" "+y2+" L"+(x2-10)+" "+(y2-7)+" L"+(x2-10)+" "+(y2+7)+" Z");
  }
  window.addEventListener("resize",draw45);

  /* strip */
  el("strip").innerHTML=STEPS.map(function(s){return '<a href="#step-'+s.n+'" aria-label="Step '+s.n+': '+esc(s.title)+'">'+s.n+'</a>'}).join("");

  /* board (static, all screens in finished state) */
  var boardBuilt=false;
  function buildBoard(){
    if(boardBuilt)return; boardBuilt=true;
    var b=el("board"), svg='<svg class="a" style="left:0;top:0" width="6940" height="80" aria-hidden="true">';
    STEPS.forEach(function(s,i){
      var root=cloneStep(s.n); root.style.left=(80+i*860)+"px";
      root.querySelectorAll(".stage").forEach(function(st){st.classList.add("shown","done")});
      b.appendChild(root);
      if(i<7){var x1=80+i*860+650,x2=80+(i+1)*860+108;
        svg+='<path d="M'+x1+' 40 L'+x2+' 40" style="fill:none;stroke:var(--line);stroke-width:3;stroke-dasharray:10 6;stroke-linecap:round"/><path d="M'+(x2+12)+' 40 L'+(x2-2)+' 31 L'+(x2-2)+' 49 Z" style="fill:var(--line)"/>';}
    });
    b.insertAdjacentHTML("afterbegin",svg+"</svg>");
    setZoom(0.75);
  }
  function setZoom(z){
    el("board").style.transform="scale("+z+")";
    el("boardSize").style.width=(6940*z)+"px"; el("boardSize").style.height=(1000*z)+"px";
    document.querySelectorAll(".zoom button").forEach(function(btn){btn.setAttribute("aria-pressed",String(+btn.dataset.z===z))});
  }
  document.querySelectorAll(".zoom button").forEach(function(btn){btn.addEventListener("click",function(){setZoom(+btn.dataset.z)})});

  /* step walk-through */
  var cur={n:0,idx:0,stages:[]}, autoplay=false;
  function mountStep(n){
    var c=el("stepCanvas"); c.innerHTML=""; var root=cloneStep(n); c.appendChild(root);
    cur={n:n,idx:0,stages:Array.prototype.slice.call(root.querySelectorAll(".stage"))};
    cur.stages[0].classList.add("shown");
    document.querySelectorAll("#strip a").forEach(function(a,i){ if(i+1===n)a.setAttribute("aria-current","step"); else a.removeAttribute("aria-current")});
    window.scrollTo(0,0); updateControls();
    autoplay=false; var playFor=n; setTimeout(function(){ if(cur.n===playFor&&cur.idx===0)play(); },400);
  }
  function updateControls(){
    var last=cur.idx===cur.stages.length-1, st=cur.stages[cur.idx];
    el("bNext").textContent=last?(cur.n<8?"Step "+(cur.n+1)+" →":"Full whiteboard →"):"Next screen →";
    el("bBack").textContent=cur.idx>0?"← Back":(cur.n>1?"← Step "+(cur.n-1):"← Overview");
    el("bPlay").textContent=st.classList.contains("done")||st.classList.contains("playing")?"↻ Replay":"▶ Play";
    el("where").textContent=cur.stages.length>1?"screen "+(cur.idx+1)+" of "+cur.stages.length:"1 screen";
  }
  function play(){
    var st=cur.stages[cur.idx]; st.classList.remove("done","playing"); void st.offsetWidth; st.classList.add("playing"); updateControls();
    var anims=st.getAnimations?st.getAnimations({subtree:true}):[];
    Promise.all(anims.map(function(a){return a.finished})).then(function(){
      if(st.classList.contains("playing")){st.classList.remove("playing");st.classList.add("done");}
    }).catch(function(){});
  }
  function next(){
    if(cur.idx<cur.stages.length-1){
      var st=cur.stages[cur.idx]; st.classList.remove("playing"); st.classList.add("done");
      cur.idx++; var nx=cur.stages[cur.idx]; nx.classList.add("shown");
      var target=nx.querySelector(".win"); if(target)target.scrollIntoView({behavior:"smooth",block:"center"});
      updateControls(); setTimeout(play,400);
    } else {autoplay=cur.n<8; location.hash=cur.n<8?"step-"+(cur.n+1):"board";}
  }
  function back(){
    if(cur.idx>0){
      var st=cur.stages[cur.idx]; st.classList.remove("shown","done","playing");
      cur.idx--; var pv=cur.stages[cur.idx].querySelector(".win"); if(pv)pv.scrollIntoView({behavior:"smooth",block:"center"});
      updateControls();
    } else location.hash=cur.n>1?"step-"+(cur.n-1):"home";
  }
  el("bPlay").addEventListener("click",play);
  el("bNext").addEventListener("click",next);
  el("bBack").addEventListener("click",back);
  document.addEventListener("keydown",function(e){
    if(e.metaKey||e.ctrlKey||e.altKey)return;
    if(e.key==="Escape"){location.hash="home";return}
    if(el("v-step").hidden)return;
    if(e.key==="ArrowRight"||e.key===" "){e.preventDefault();next()}
    else if(e.key==="ArrowLeft"){e.preventDefault();back()}
    else if(e.key==="p"||e.key==="P"){e.preventDefault();play()}
  });

  /* routing */
  function route(){
    var h=(location.hash||"").slice(1), m=/^step-([1-8])$/.exec(h), view=m?"step":(h==="board"?"board":"home");
    ["home","step","board"].forEach(function(v){el("v-"+v).hidden=v!==view});
    document.querySelectorAll("[data-nav]").forEach(function(a){ if(a.dataset.nav===view)a.setAttribute("aria-current","page"); else a.removeAttribute("aria-current")});
    if(view==="step")mountStep(+m[1]);
    else if(view==="board"){buildBoard();window.scrollTo(0,0)}
    else {window.scrollTo(0,0);requestAnimationFrame(draw45);if(document.fonts)document.fonts.ready.then(draw45)}
  }
  window.addEventListener("hashchange",route); route();
})();
</script>
